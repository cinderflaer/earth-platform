# Earth Platform, Fabric. One bump of mod_version here releases the jar.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.workers.max=2

# Parchment names for the game's methods and parameters: https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]

# Compile against the oldest Fabric Loader the jar accepts: newer loaders bring a Mixin that writes
# @Redirect's @At as an array, which older loaders' MixinExtras can't read.
loader_version=0.16.14
loader_version_range=>=0.16.14
fabric_api_version=0.116.17+1.21.1
# Range the jar accepts at runtime: any 1.21.1 Fabric API from the one the mod's hooks first shipped in
fabric_api_version_range=>=0.116.0
# NeoForge's config classes on Fabric, bundled in the jar so the TOML files and the config screen match
forge_config_api_port_version=21.1.6

## Mod properties
mod_id=earthplatform
# The human-readable display name for the mod.
mod_name=Earth Platform
mod_license=LGPL-3.0-only
# The mod version. See https://semver.org/
mod_version=0.1.0-alpha.76
# This should match the base package used for the mod sources.
# See https://maven.apache.org/guides/mini/guide-naming-conventions.html
mod_group_id=io.earthplatform
