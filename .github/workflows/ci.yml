# Builds the mod and runs the tests on every pull request. Read-only: it can't push, tag or release,
# and pull requests from forks get no secrets. Third-party actions are pinned to full commit SHAs.
name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Builds the Fabric jar and runs the unit tests. Loom needs Gradle 9.5+.
  fabric:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: '9.8.2'

      # Same checked inputs as the release build (see docs/BUILDING.md). None of them is bundled.
      - name: Fetch the external build inputs
        run: |
          mkdir -p "$RUNNER_TEMP/inputs" && cd "$RUNNER_TEMP/inputs"
          curl -fsSLo iris-fabric.jar 'https://cdn.modrinth.com/data/YL57xq9U/versions/bAo1Qhte/iris-fabric-1.8.14-beta.1%2Bmc1.21.1.jar'
          curl -fsSLo sodium-fabric.jar 'https://cdn.modrinth.com/data/AANobbMI/versions/SMxNOGZ6/sodium-fabric-0.8.13%2Bmc1.21.1.jar'
          curl -fsSLo bugcourier-fabric.jar 'https://github.com/pirut/mc-mods/releases/download/bug-courier-v0.1.0/bugcourier-fabric-1.21.1-0.1.0.jar'
          sha256sum -c - <<'SUMS'
          0ceb694040b4628bf3fa02286cfe5f0db833195669ab07f8caa4001359763eff  iris-fabric.jar
          3d43c14985a4deb19c654aad3393b454cf57e1ebcbba86c4ae6a98dfc60eca2d  sodium-fabric.jar
          d082b37978957872c2ef681660c6ce069f4964a31d8e8d444c5f548c484e85ab  bugcourier-fabric.jar
          SUMS
          {
            echo "EARTH_INSTALLED_FABRIC_IRIS_JAR=$PWD/iris-fabric.jar"
            echo "EARTH_INSTALLED_FABRIC_SODIUM_JAR=$PWD/sodium-fabric.jar"
            echo "EARTH_BUG_COURIER_FABRIC_JAR=$PWD/bugcourier-fabric.jar"
          } >> "$GITHUB_ENV"

      - name: Build the Fabric jar
        working-directory: fabric
        run: gradle --no-daemon --console=plain build "-PearthBuildCommit=$(git rev-parse HEAD)"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: EarthPlatform-fabric-current-build
          path: fabric/build/libs/earthplatform-fabric-*.jar
          if-no-files-found: error
          retention-days: 14
